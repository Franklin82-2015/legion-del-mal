name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 😀 Normal
          - 😁 Alta
          - 😶‍🌫️ crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:      
      - name: Imprimir Inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Nivel: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"          