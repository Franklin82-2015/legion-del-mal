name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"

      cow_character:
        description: "Personaje"
        required: true
        type: choice
        options:
          - eyes
          - ghostbusters
          - dragon
          - fox
          - king

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 😀 Normal
          - 😁 Alta
          - 😶‍🌫️ crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisior de la legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir Inputs
        run: |
          echo "================================"
          echo "    Transmisión interceptada"
          echo "================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha $(date -u + "%d/%m/%Y - %H:%M UTC")"
          echo "-----Mensaje-----"
          cowsay -f "${{ inputs.cow_character }}" "${{ inputs.mensaje }}"
          echo ""
          echo "----- ${{ inputs.villano }}"
          echo "..."          